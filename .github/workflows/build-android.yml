name: Build Android APK

# 手动跑或 push main 自动出 APK；release 精简包会自动提交回仓库 release/ 目录。
on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: "true"

jobs:
  android:
    name: Android (aarch64 / arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 设置 pnpm
        run: npm i -g pnpm@10

      - name: 设置 Rust（含 Android target）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 设置 Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: 接受 Android SDK 许可
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        run: pnpm build

      - name: 初始化 Android 工程
        run: npx tauri android init

      - name: release 复用 debug 签名（便于覆盖安装）
        run: |
          sed -i 's/getByName("release") {/getByName("release") {\n            signingConfig = signingConfigs.getByName("debug")/' \
            src-tauri/gen/android/app/build.gradle.kts
          grep -n "signingConfig" src-tauri/gen/android/app/build.gradle.kts

      - name: 构建 release APK（aarch64 精简包）
        run: npx tauri android build --target aarch64

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-aarch64-release
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: 精简包提交回仓库 release/ 目录
        if: github.event_name == 'push'
        run: |
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
             release/HGhub-android-1.2.0-fix-arm64.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/HGhub-android-1.2.0-fix-arm64.apk
          if git diff --cached --quiet; then
            echo "APK 无变化，跳过提交"
          else
            git commit -m "chore(release): CI 精简包 ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID}) [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
